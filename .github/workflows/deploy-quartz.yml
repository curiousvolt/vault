name: Deploy Quartz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout vault
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Quartz (pinned)
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          git init .quartz-build
          git -C .quartz-build remote add origin https://github.com/jackyzha0/quartz.git
          git -C .quartz-build fetch --depth 1 origin 97a2d05f80c4c50534959b1d0d41cc4b3895625e
          git -C .quartz-build checkout --detach FETCH_HEAD

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .quartz-build/package-lock.json

      - name: Install Quartz
        working-directory: .quartz-build
        run: npm ci

      - name: Use vault configuration
        run: |
          cp quartz.config.yaml .quartz-build/quartz.config.yaml
          cp quartz.ts .quartz-build/quartz.ts
          mkdir -p .quartz-build/quartz/styles
          cp quartz/styles/custom.scss .quartz-build/quartz/styles/custom.scss
          rm -rf .quartz-build/local-plugins
          cp -R local-plugins .quartz-build/local-plugins

      - name: Include virtual pages in folder hierarchy
        working-directory: .quartz-build
        run: |
          python -c 'from pathlib import Path; p=Path("quartz/plugins/pageTypes/dispatcher.ts"); s=p.read_text(); n="      const allFilesWithVirtual = [...allFiles, ...virtualEntries.map((ve) => ve.vfile.data)]"; r=n+"\n\n      const trieFiles = allFilesWithVirtual.map((file) => ({ ...file, filePath: file.filePath ?? file.relativePath }))\n      ctx.trie = trieFromAllFiles(trieFiles)"; assert s.count(n) == 2, f"expected 2 merge points, found {s.count(n)}"; p.write_text(s.replace(n, r))'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate favicon from CuriousVolt logo
        working-directory: .quartz-build
        run: |
          node --input-type=module -e "import sharp from 'sharp'; await sharp('../static/curiousvolt-logo.svg').resize(256, 256, { fit: 'contain', background: { r: 255, g: 255, b: 255, alpha: 0 } }).png().toFile('quartz/static/icon.png')"

      - name: Install Quartz plugins and build
        working-directory: .quartz-build
        run: npm run quartz -- build -d .. -o public

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .quartz-build/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
