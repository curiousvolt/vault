name: Deploy Quartz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Quartz
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          git clone --depth 1 --branch v5 https://github.com/jackyzha0/quartz.git .quartz-build

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .quartz-build/package-lock.json

      - name: Install Quartz
        working-directory: .quartz-build
        run: npm ci

      - name: Use vault configuration
        run: |
          cp quartz.config.yaml .quartz-build/quartz.config.yaml
          mkdir -p .quartz-build/quartz/styles
          cp quartz/styles/custom.scss .quartz-build/quartz/styles/custom.scss
          rm -rf .quartz-build/local-plugins
          cp -R local-plugins .quartz-build/local-plugins

      - name: Install Quartz plugins and build
        working-directory: .quartz-build
        run: npm run quartz -- build -d .. -o public

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .quartz-build/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
